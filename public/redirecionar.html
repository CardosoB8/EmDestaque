<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecionando…</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { @apply bg-gray-50 flex items-center justify-center h-screen text-gray-800; }
    #message { @apply text-center text-lg; }
  </style>
</head>
<body>
  <div id="message">Redirecionando você para a plataforma parceira…</div>

  <script>
    (function() {
      const partnerUrl = 'https://record.elephantbet.com/_rhoOOvBxBOAWqcfzuvZcQGNd7ZgqdRLk/1/'; // ← Substitua
      const KEY = 'redirectTime';
      const now = Date.now();
      const saved = localStorage.getItem(KEY);

      if (!saved) {
        // 1ª vez: salva timestamp e redireciona
        localStorage.setItem(KEY, now);
        window.location.href = partnerUrl;
      } else {
        // Usuário voltou: checa 2 minutos
        const elapsed = now - parseInt(saved, 10);
        if (elapsed >= 2 * 60 * 1000) {
          // OK: volta à index para habilitar botão
          window.location.href = 'https://vailink.pro/guia-especialista-apostas-online';
        } else {
          // Falha: pede cadastro + espera, limpa storage para reiniciar
          document.getElementById('message').textContent =
            'Conclua o cadastro na plataforma parceira e após completar pode voltar para página inicial Seu Guia será Liberado.';
          localStorage.removeItem(KEY);
        }
      }
    })();
  </script>
</body>
</html>
