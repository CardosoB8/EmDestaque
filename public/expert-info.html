    <style>
        /* Reset CSS */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Variáveis CSS */
        :root {
            --primary-color: #2563eb;
            --secondary-color: #1e40af;
            --text-color: #1f2937;
            --bg-color: #f3f4f6;
        }

        /* Estilos Base */
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            line-height: 1.5;
            color: var(--text-color);
            background-color: var(--bg-color);
            min-height: 100vh;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        /* Estilos da Bio */
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 1.5rem;
            border: 4px solid white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: var(--text-color);
        }

        .bio-text {
            margin-bottom: 2rem;
            color: #4b5563;
            max-width: 65ch;
            margin-left: auto;
            margin-right: auto;
        }

        /* Estilos dos Links */
        .links-container {
            display: grid;
            gap: 1rem;
            width: 100%;
        }

        .link-button {
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            color: white;
            text-decoration: none;
            padding: 1rem 2rem;
            border-radius: 0.75rem;
            font-weight: 600;
            transition: transform 0.2s ease, opacity 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .link-button:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }

        /* Responsividade */
        @media (max-width: 640px) {
            body {
                padding: 1.5rem 1rem;
            }

            h1 {
                font-size: 1.5rem;
            }

            .link-button {
                padding: 0.875rem 1.5rem;
            }
        }
    </style>
</head>
<body>

                Aposta online na casa nº2
            </a>
            
            <a href="https://guia-apostas-mz.vercel.app" class="link-button" target="_blank" rel="noopener">
                🌐 Meu Website

        </div>
    </div>
</body>
