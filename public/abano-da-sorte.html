<body>
  <div class="header">

  <div class="container">

  <!-- Modal -->

      </div>

        Criar conta para Receber

  <script>
    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");
    const spinButton = document.getElementById("spinButton");
    const modal = document.getElementById("modal");
    const closeModal = document.querySelector(".close");
    const rewardMessage = document.getElementById("rewardMessage");
    const okButton = document.getElementById("okButton");
    const spinsCountElement = document.getElementById("spinsCount");

    let spinsAvailable = 3;
    const rewards = [
      "1GB",
      "200MB",
      "5 Minutos",
      "10 Minutos",
      "50MB",
      "50SMS",
      "2 Minutos",
      "10GB",
      "100SMS",
      "500MB",
      "Boa sorte da Proxima!"
    ];
    const colors = [
      "#FF6384",
      "#36A2EB",
      "#FFCE56",
      "#4BC0C0",
      "#9966FF",
      "#FF9F40",
      "#8BC34A",
      "#E53935",
      "#FFCE56",
      "#4BC0C0",
      "#9966FF",
      "#FF9F40"
    ];

    const numSegments = rewards.length;
    const arcSize = (2 * Math.PI) / numSegments;
    let startAngle = 0;
    let spinAngle = 0;
    let spinning = false;

    function drawWheel() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < numSegments; i++) {
        const angle = startAngle + i * arcSize;
        ctx.beginPath();
        ctx.fillStyle = colors[i % colors.length];
        ctx.moveTo(250, 250);
        ctx.arc(250, 250, 250, angle, angle + arcSize, false);
        ctx.fill();
        ctx.save();
        ctx.fillStyle = "#fff";
        ctx.translate(250, 250);
        ctx.rotate(angle + arcSize / 2);
        ctx.textAlign = "right";
        ctx.font = "bold 18px Arial";
        ctx.fillText(rewards[i], 230, 10);
        ctx.restore();
      }
    }

    function spin() {
      if (spinning || spinsAvailable <= 0) return;
      spinning = true;
      spinButton.disabled = true;
      spinsAvailable--;
      spinsCountElement.textContent = spinsAvailable;

      const extraSpins = Math.floor(Math.random() * 3) + 3;
      const randomAngle = Math.random() * 2 * Math.PI;
      const targetAngle = extraSpins * 2 * Math.PI + randomAngle;
      const duration = 10000;
      const startTime = performance.now();

      function animate(now) {
        const elapsed = now - startTime;
        if (elapsed < duration) {
          const progress = elapsed / duration;
          const easedProgress = 1 - Math.pow(1 - progress, 2);
          spinAngle = easedProgress * targetAngle;
          startAngle = spinAngle;
          drawWheel();
          requestAnimationFrame(animate);
        } else {
          spinAngle = targetAngle;
          startAngle = spinAngle;
          drawWheel();
          spinning = false;
          spinButton.disabled = spinsAvailable <= 0;
          determineReward();
        }
      }
      requestAnimationFrame(animate);
    }
    

    function determineReward() {
  // Normaliza o ângulo final da roda para ficar entre 0 e 2π
  const normalizedAngle = startAngle % (2 * Math.PI);
  // Calcula o ângulo em relação ao ponteiro (no topo, 3π/2)
  const pointerAngle = (3 * Math.PI / 2 - normalizedAngle + 2 * Math.PI) % (2 * Math.PI);
  // Determina o índice da recompensa com base no tamanho de cada segmento
  const index = Math.floor(pointerAngle / arcSize);
  rewardMessage.textContent = `Você ganhou: ${rewards[index]}!`;
  modal.style.display = "block";
}


    // Event Listeners
    spinButton.addEventListener("click", spin);
    closeModal.addEventListener("click", () => modal.style.display = "none");
    okButton.addEventListener("click", () => {
      modal.style.display = "none";
      window.open("https://media1.placard.co.mz/redirect.aspx?pid=5905&bid=1690", "_blank");
    });
    window.addEventListener("click", (event) => {
      
    });

    // Countdown Timer
    function startCountdown() {
      let time = 86400;
      const countdownElement = document.getElementById("countdown");
      setInterval(() => {
        time--;
        const hours = Math.floor(time / 3600);
        const minutes = Math.floor((time % 3600) / 60);
        const seconds = time % 60;
        countdownElement.textContent = 
          `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      }, 1000);
    }

    // Initial Setup
    drawWheel();
    startCountdown();
    const sound1 = new Audio("lucky_spin.mp3");
    sound1.preload = "auto";
    const sound2 = new Audio("lucky_done.mp3");
    sound2.preload = "auto";

    let isPlaying = false; // Para evitar múltiplas execuções simultâneas

    document.getElementById("spinButton").addEventListener("click", async () => {
      if (isPlaying) return; // Evita múltiplas execuções
      isPlaying = true;

      // Defina a duração de cada som (em milissegundos)
      const duration1 = 10000; // 5 segundos para o primeiro som
      const duration2 = 4000; // 4 segundos para o segundo som

      try {
        // Toca o primeiro som
        await sound1.play();
      } catch (err) {
        console.error("Erro ao reproduzir o primeiro som:", err);
      }

      // Após o tempo definido, interrompe o primeiro som e inicia o segundo
      setTimeout(async () => {
        sound1.pause();
        sound1.currentTime = 0; // Reinicia o áudio

        try {
          // Toca o segundo som
          await sound2.play();
        } catch (err) {
          console.error("Erro ao reproduzir o segundo som:", err);
        }

        // Após o tempo definido, interrompe o segundo som e libera a possibilidade de novo clique
        setTimeout(() => {
          sound2.pause();
          sound2.currentTime = 0; // Reinicia o áudio
          isPlaying = false;
        }, duration2);

      }, duration1);
    });
  </script>
