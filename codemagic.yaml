workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 45

    scripts:
      - name: Make Gradlew Executable
        script: |
          chmod +x gradlew

      - name: Clean
        script: |
          ./gradlew clean

      - name: Build Debug APK
        script: |
          ./gradlew assembleDebug

      - name: List generated APKs
        script: |
          echo ">> APKs gerados:"
          find . -type f -name "*.apk"

    artifacts:
      # ajuste este padrão ao caminho que o `find` mostrar
      - app/build/outputs/apk/debug/*.apk

    publishing:
      email:
        recipients:
          - maisconhe@gmail.com