workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 45

    scripts:
      - name: Make Gradlew Executable
        script: chmod +x gradlew

      - name: Clean
        script: ./gradlew clean

      - name: Build Debug APK
        script: ./gradlew assembleDebug

      - name: Dump project root
        script: |
          echo "===== Conteúdo da raiz do projeto ====="
          ls -R .

      - name: Dump potential output dirs
        script: |
          echo "===== Procurando por pastas 'build' ====="
          find . -type d -name build

      - name: List any APKs anywhere
        script: |
          echo "===== APKs encontrados no workspace ====="
          find . -type f -name "*.apk"

    artifacts:
      # Vai configurar depois que você descobrir o caminho correto
      - app/build/outputs/apk/debug/*.apk

    publishing:
      email:
        recipients:
          - maisconhe@gmail.com