workflows:
  android-workflow:
    name: Build Android APK
    max_build_duration: 60

    # Gatilhos de build automáticos
    triggering:
      events:
        - push
        - pull_request

    scripts:
      - name: Clean
        script: ./gradlew clean
      - name: Build debug APK
        script: ./gradlew assembleDebug

    artifacts:
      - app/build/outputs/**/*.apk
