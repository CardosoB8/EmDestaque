workflows:
  android-workflow:
    name: Build Android APK
    max_build_duration: 60

    triggering:
      events:
        - push
        - pull_request

    scripts:
      - name: Make Gradle Wrapper executable
        script: |
          chmod +x ./gradlew

      - name: Clean
        script: |
          ./gradlew clean

      - name: Build debug APK
        script: |
          ./gradlew assembleDebug

    artifacts:
      - app/build/outputs/**/*.apk
